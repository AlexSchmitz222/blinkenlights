<div class="container">
    <div class="pixelRow" *ngFor="let row of grid.pixels">
        <div class="pixel" *ngFor="let Pixel of row" [class.on]="Pixel.active" [class.off]="!Pixel.active">
            {{Pixel.id}}<br>
            {{Pixel.position.x}} - {{Pixel.position.y}}
        </div>
    </div>
</div>
