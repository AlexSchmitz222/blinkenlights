<div class="player">
  <app-pixel-grid class="stage" [grid]="grid" fit="contain" [debug]="debug" />
  <div class="controls">
    <a matIconButton routerLink="/" matTooltip="Back" aria-label="Back">
      <mat-icon svgIcon="arrow-left" />
    </a>
    <span class="spacer"></span>
    <button matIconButton (click)="debug = !debug" [class.active]="debug" matTooltip="Show coordinates" aria-label="Toggle coordinates">
      <mat-icon svgIcon="bug-outline" />
    </button>
  </div>
</div>
