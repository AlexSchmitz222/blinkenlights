@if (show(); as show) {
  <div class="stage-wrap" (click)="player.toggle()" (dblclick)="toggleFullscreen()">
    @if (grid(); as grid) {
      <app-pixel-grid class="stage" [grid]="grid" fit="contain" [variant]="viewMode()" [debug]="debug()" />
    }
  </div>

  <div class="controls" (click)="$event.stopPropagation()">
    <div class="scrubber">
      <input
        type="range"
        min="0"
        [max]="Math.max(0, player.frameCount() - 1)"
        [value]="player.position()"
        (input)="player.seek(+$any($event.target).value)"
        [attr.aria-label]="'player.position' | t" />
    </div>

    <div class="bar">
      <a matIconButton routerLink="/shows" [matTooltip]="'common.backToShows' | t" [attr.aria-label]="'common.backToShows' | t">
        <mat-icon svgIcon="arrow-left" />
      </a>

      <button matIconButton (click)="player.previous()" [matTooltip]="'player.previousFrame' | t" [attr.aria-label]="'player.previousFrame' | t">
        <mat-icon svgIcon="step-backward" />
      </button>
      <button matIconButton class="play" (click)="player.toggle()" [matTooltip]="(player.playing() ? 'player.pauseTooltip' : 'player.playTooltip') | t" [attr.aria-label]="(player.playing() ? 'common.pause' : 'common.play') | t">
        <mat-icon [svgIcon]="player.playing() ? 'pause' : 'play'" />
      </button>
      <button matIconButton (click)="player.next()" [matTooltip]="'player.nextFrame' | t" [attr.aria-label]="'player.nextFrame' | t">
        <mat-icon svgIcon="step-forward" />
      </button>

      <div class="info">
        <span class="title">{{ show.name }}</span>
        <span class="sub">
          {{ player.currentScene()?.name ?? '–' }} · {{ player.position() + 1 }}/{{ player.frameCount() }} · {{ elapsed() }} / {{ total() }}
        </span>
      </div>

      <span class="spacer"></span>
      <span class="preset">{{ presetName() }}</span>

      <button matIconButton (click)="toggleLoop()" [class.active]="player.loop()" [matTooltip]="'player.loop' | t" [attr.aria-label]="'player.toggleLoop' | t">
        <mat-icon [svgIcon]="player.loop() ? 'repeat' : 'repeat-off'" />
      </button>
      <button
        matIconButton
        (click)="setViewMode(viewMode() === 'facade' ? 'pixel' : 'facade')"
        [class.active]="viewMode() === 'facade'"
        [matTooltip]="(viewMode() === 'facade' ? 'player.asPixels' : 'player.asFacade') | t"
        [attr.aria-label]="'player.toggleFacade' | t">
        <mat-icon svgIcon="window-closed-variant" />
      </button>
      <button matIconButton (click)="debug.set(!debug())" [class.active]="debug()" [matTooltip]="'common.showCoordinates' | t" [attr.aria-label]="'common.showCoordinates' | t">
        <mat-icon svgIcon="grid" />
      </button>
      <button matIconButton (click)="toggleFullscreen()" [matTooltip]="(fullscreen() ? 'player.exitFullscreen' : 'player.fullscreen') | t" [attr.aria-label]="'player.toggleFullscreen' | t">
        <mat-icon [svgIcon]="fullscreen() ? 'fullscreen-exit' : 'fullscreen'" />
      </button>
    </div>
  </div>
} @else {
  <div class="missing">
    <p>{{ 'common.notFoundShow' | t }}</p>
    <a matButton="outlined" routerLink="/shows">{{ 'common.backToShows' | t }}</a>
  </div>
}
